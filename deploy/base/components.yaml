# Generated layout: one Deployment + Service per hop. All run the same image; ROLE picks the behaviour.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  labels: {app.kubernetes.io/component: waf}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: waf}
  template:
    metadata:
      labels: {app.kubernetes.io/component: waf}
    spec:
      containers:
        - name: waf
          image: prompt-path-demo
          imagePullPolicy: IfNotPresent
          env:
            - name: ROLE
              value: "waf"
            - name: COMPONENT
              value: "waf"
            - name: DISPLAY_NAME
              value: "Edge WAF"
            - name: UPSTREAM
              value: "http://slot-aigw:8080"
          ports:
            - {name: hop, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: hop}
            periodSeconds: 2
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: waf
spec:
  selector: {app.kubernetes.io/component: waf}
  ports:
    - {name: http, port: 8080, targetPort: hop}
---
