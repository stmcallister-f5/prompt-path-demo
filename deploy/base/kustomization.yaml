apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prompt-demo
labels:
  - pairs: {app.kubernetes.io/part-of: prompt-path-demo}
    includeSelectors: false
resources:
  - namespace.yaml
  - components.yaml
  - slots.yaml
  - board.yaml
  - gateway.yaml
configMapGenerator:
  - name: board-config
    files: [config.yaml=board-config.yaml]
images:
  - name: prompt-path-demo
    newName: prompt-path-demo
    newTag: dev
