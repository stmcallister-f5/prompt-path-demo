# F5 WAF for NGINX (v5) as a standalone proxy sitting in the WAF slot. Three
# containers share the pod: NGINX Plus with the WAF module, the WAF enforcer,
# and the config manager. All three are WAF release 5.16.1 and amd64 only.
# Verified in plain Docker on an arm64 Mac (amd64 emulation) on 2026-11-05:
# SQLi in the URL and inside a JSON chat body are blocked, a prompt injection
# passes. Running on kind since 2026-11-05.
#
# The NGINX image is built locally (make waf-image); F5 doesn't publish one.
# The default policy answers a block with a 200 "Request Rejected" page, so the
# WAF relay matches its "support ID" text (RELAY_BLOCK_PATTERN).
#
# Alternative: run F5 WAF for NGINX inside NGINX Gateway Fabric (NGINX Plus
# edition) and treat the WAF as part of the Gateway hop instead of a toggle.
apiVersion: v1
kind: ConfigMap
metadata:
  name: f5-waf-nginx
data:
  nginx.conf: |
    load_module modules/ngx_http_app_protect_module.so;
    events {}
    http {
      app_protect_enforcer_address 127.0.0.1:50000;
      # Fail closed: if the enforcer is down, return 503 rather than pass traffic uninspected.
      app_protect_failure_mode_action drop;
      server {
        listen 8080;
        app_protect_enable on;
        # Default policy plus 429 as an allowed response code. Without it the WAF
        # (which also inspects responses) replaces the AI gateway's 429 with its
        # own block page, and the board credits the WAF for the throttle.
        # Source: deploy/images/f5-waf/booth-policy.json, compiled into the image.
        app_protect_policy_file /etc/app_protect/bundles/booth-policy.tgz;
        app_protect_security_log_enable on;
        app_protect_security_log log_all stderr;
        location /healthz { return 200 "ok"; }
        location / {
          proxy_pass http://slot-aigw:8080;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f5-waf
  labels: {app.kubernetes.io/component: f5-waf}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: f5-waf}
  template:
    metadata:
      labels: {app.kubernetes.io/component: f5-waf}
    spec:
      initContainers:
        # The compiled policy bundle ships in the nginx image; copy it into the
        # bundles volume that nginx and the config manager share.
        - name: policy
          image: f5-waf-nginx:5.16.1
          imagePullPolicy: IfNotPresent
          command: [cp, /opt/booth/booth-policy.tgz, /etc/app_protect/bundles/]
          volumeMounts: [{name: bundles, mountPath: /etc/app_protect/bundles}]
      containers:
        - name: nginx
          image: f5-waf-nginx:5.16.1                 # make waf-image, then load into kind
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: bundles, mountPath: /etc/app_protect/bundles}
            - {name: config, mountPath: /opt/app_protect/config}
            - {name: bd-config, mountPath: /opt/app_protect/bd_config}
            - {name: license, mountPath: /etc/nginx/license.jwt, subPath: license.jwt}
        - name: waf-enforcer
          image: private-registry.nginx.com/nap/waf-enforcer:5.16.1
          imagePullPolicy: IfNotPresent
          env: [{name: ENFORCER_PORT, value: "50000"}]
          volumeMounts: [{name: bd-config, mountPath: /opt/app_protect/bd_config}]
        - name: waf-config-mgr
          image: private-registry.nginx.com/nap/waf-config-mgr:5.16.1
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - {name: bundles, mountPath: /etc/app_protect/bundles}
            - {name: config, mountPath: /opt/app_protect/config}
            - {name: bd-config, mountPath: /opt/app_protect/bd_config}
      volumes:
        - {name: conf, configMap: {name: f5-waf-nginx}}
        - {name: bundles, emptyDir: {}}
        - {name: config, emptyDir: {}}
        - {name: bd-config, emptyDir: {}}
        - {name: license, secret: {secretName: nginx-license}}
---
apiVersion: v1
kind: Service
metadata:
  name: f5-waf
spec:
  selector: {app.kubernetes.io/component: f5-waf}
  ports: [{name: http, port: 8080, targetPort: http}]
