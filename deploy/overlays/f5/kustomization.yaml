# F5 booth stack. Same slots, same board, same scenarios: each mock layer is
# replaced by a relay in front of the real product (or, for the guardrails,
# the guardrail hop switches to calling F5 AI Guardrails).
#
#   (guardrails: see ../../components/f5-guardrails)
#   edit endpoints.env                          # point relays at your products
#   kubectl apply -k deploy/overlays/f5
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prompt-demo
resources:
  - ../../base
components:
  - ../../components/f5-waf
  - ../../components/f5-guardrails
  # - ../../components/vllm                    # uncomment for a real model on vLLM
configMapGenerator:
  - name: board-config
    behavior: replace
    files: [config.yaml=board-config.yaml]
  - name: f5-endpoints
    envs: [endpoints.env]
patches:
  # AI gateway slot: relay -> F5 AI Gateway -> slot-guard
  - target: {kind: Deployment, name: aigw}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - {name: ROLE, value: relay}
          - {name: COMPONENT, value: aigw}
          - {name: DISPLAY_NAME, value: F5 AI Gateway}
          - name: UPSTREAM
            valueFrom: {configMapKeyRef: {name: f5-endpoints, key: AIGW_URL}}
